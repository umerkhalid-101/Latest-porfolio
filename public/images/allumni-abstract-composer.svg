<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- Abstract wireframe: the composer holding attached images, documents and files above the prompt -->
  <defs>
    <linearGradient id="img" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9A8FF"/><stop offset="1" stop-color="#5B3DF5"/></linearGradient>
    <g id="close"><circle r="13" fill="#1A1530"/><path d="M-5 -5 l10 10 M5 -5 l-10 10" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></g>
  </defs>
  <rect width="1040" height="560" fill="#F6F5FB"/>
  <rect x="80" y="60" width="880" height="440" rx="32" fill="#fff" stroke="#1A1530" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Attachments -->
  <g>
    <rect x="120" y="100" width="140" height="140" rx="18" fill="url(#img)"/>
    <path d="M120 222 l40 -46 l30 30 l22 -20 l48 52 v4 a18 18 0 0 1 -18 18 h-104 a18 18 0 0 1 -18 -18 z" fill="#fff" fill-opacity="0.45"/>
    <circle cx="222" cy="140" r="14" fill="#fff" fill-opacity="0.7"/>
    <use href="#close" x="258" y="102"/>
  </g>
  <g>
    <rect x="284" y="100" width="140" height="140" rx="18" fill="#F1EFF8"/>
    <g fill="#1A1530" opacity="0.25"><rect x="306" y="128" width="96" height="10" rx="5"/><rect x="306" y="148" width="80" height="10" rx="5"/><rect x="306" y="168" width="90" height="10" rx="5"/><rect x="306" y="188" width="60" height="10" rx="5"/></g>
    <use href="#close" x="422" y="102"/>
  </g>
  <g>
    <rect x="448" y="100" width="140" height="140" rx="18" fill="#F1EFF8"/>
    <rect x="482" y="146" width="72" height="44" rx="10" fill="#E2453C"/>
    <text x="518" y="176" font-size="22" font-weight="800" text-anchor="middle" fill="#fff">PDF</text>
    <use href="#close" x="586" y="102"/>
  </g>
  <g>
    <rect x="612" y="100" width="140" height="140" rx="18" fill="#F1EFF8"/>
    <rect x="646" y="146" width="72" height="44" rx="10" fill="#E8833A"/>
    <text x="682" y="176" font-size="22" font-weight="800" text-anchor="middle" fill="#fff">PPT</text>
    <use href="#close" x="750" y="102"/>
  </g>
  <g>
    <rect x="776" y="100" width="140" height="140" rx="18" fill="#F1EFF8"/>
    <rect x="810" y="146" width="72" height="44" rx="10" fill="#1A1530" fill-opacity="0.7"/>
    <text x="846" y="176" font-size="22" font-weight="800" text-anchor="middle" fill="#fff">ZIP</text>
    <use href="#close" x="914" y="102"/>
  </g>

  <!-- Prompt -->
  <line x1="120" y1="290" x2="920" y2="290" stroke="#1A1530" stroke-opacity="0.08" stroke-width="2"/>
  <rect x="120" y="330" width="460" height="18" rx="9" fill="#1A1530" opacity="0.2"/>
  <rect x="120" y="364" width="320" height="18" rx="9" fill="#1A1530" opacity="0.2"/>
  <circle cx="140" cy="452" r="20" fill="none" stroke="#1A1530" stroke-opacity="0.3" stroke-width="3"/>
  <path d="M140 442 v20 M130 452 h20" stroke="#1A1530" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
  <circle cx="884" cy="452" r="30" fill="#5B3DF5"/>
  <path d="M884 466 v-28 M872 450 l12 -12 l12 12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
