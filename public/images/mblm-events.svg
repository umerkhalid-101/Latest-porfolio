<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- Abstract wireframe: a mobile events calendar split by audience and a short enquiry flow, annotated -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6D3B5"/><stop offset="1" stop-color="#EAB48C"/></linearGradient>
    <pattern id="cols" width="80" height="540" patternUnits="userSpaceOnUse"><rect x="8" width="64" height="540" fill="#161616" opacity="0.05"/></pattern>
    <filter id="sh" x="-30%" y="-20%" width="160%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#5A2A0C" flood-opacity="0.3"/></filter>
    <filter id="pill" x="-20%" y="-40%" width="140%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/></filter>
    <clipPath id="frame"><rect width="960" height="540"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="960" height="540" fill="url(#bg)"/>
    <rect width="960" height="540" fill="url(#cols)"/>

    <!-- Phone 1: calendar -->
    <g transform="translate(-36 20)">
      <rect x="236" y="48" width="232" height="520" rx="36" fill="#161616" filter="url(#sh)"/>
      <rect x="246" y="58" width="212" height="510" rx="28" fill="#FAF8F5"/>
      <rect x="322" y="66" width="60" height="16" rx="8" fill="#161616"/>

      <rect x="262" y="98" width="180" height="30" rx="15" fill="#121115" fill-opacity="0.06"/>
      <rect x="264" y="100" width="58" height="26" rx="13" fill="#161616"/>
      <text x="293" y="117" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">Visit</text>
      <text x="352" y="117" font-size="11" font-weight="600" text-anchor="middle" fill="#121115" fill-opacity="0.6">Exhibit</text>
      <text x="411" y="117" font-size="11" font-weight="600" text-anchor="middle" fill="#121115" fill-opacity="0.6">Organize</text>

      <text x="262" y="160" font-size="18" font-weight="800" fill="#121115">What’s on</text>

      <g font-size="13" font-weight="700" text-anchor="middle">
        <rect x="262" y="174" width="32" height="44" rx="10" fill="#fff" stroke="#121115" stroke-opacity="0.1"/>
        <rect x="271" y="182" width="14" height="4" rx="2" fill="#121115" fill-opacity="0.25"/>
        <text x="278" y="206" fill="#121115">12</text>
        <rect x="299" y="174" width="32" height="44" rx="10" fill="#B8572A"/>
        <rect x="308" y="182" width="14" height="4" rx="2" fill="#fff" fill-opacity="0.6"/>
        <text x="315" y="206" fill="#fff">13</text>
        <rect x="336" y="174" width="32" height="44" rx="10" fill="#fff" stroke="#121115" stroke-opacity="0.1"/>
        <rect x="345" y="182" width="14" height="4" rx="2" fill="#121115" fill-opacity="0.25"/>
        <text x="352" y="206" fill="#121115">14</text>
        <rect x="373" y="174" width="32" height="44" rx="10" fill="#fff" stroke="#121115" stroke-opacity="0.1"/>
        <rect x="382" y="182" width="14" height="4" rx="2" fill="#121115" fill-opacity="0.25"/>
        <text x="389" y="206" fill="#121115">15</text>
        <rect x="410" y="174" width="32" height="44" rx="10" fill="#fff" stroke="#121115" stroke-opacity="0.1"/>
        <rect x="419" y="182" width="14" height="4" rx="2" fill="#121115" fill-opacity="0.25"/>
        <text x="426" y="206" fill="#121115">16</text>
      </g>

      <g font-size="10" font-weight="600" text-anchor="middle">
        <rect x="262" y="230" width="44" height="22" rx="11" fill="#161616"/>
        <text x="284" y="245" fill="#fff">All</text>
        <rect x="312" y="230" width="56" height="22" rx="11" fill="none" stroke="#121115" stroke-opacity="0.2"/>
        <text x="340" y="245" fill="#121115" fill-opacity="0.7">Tech</text>
        <rect x="374" y="230" width="62" height="22" rx="11" fill="none" stroke="#121115" stroke-opacity="0.2"/>
        <text x="405" y="245" fill="#121115" fill-opacity="0.7">Health</text>
      </g>

      <rect x="262" y="266" width="180" height="78" rx="14" fill="#fff" stroke="#121115" stroke-opacity="0.08"/>
      <rect x="270" y="274" width="62" height="62" rx="10" fill="#B8572A"/>
      <rect x="342" y="282" width="88" height="8" rx="4" fill="#121115" fill-opacity="0.8"/>
      <rect x="342" y="298" width="64" height="6" rx="3" fill="#121115" fill-opacity="0.3"/>
      <rect x="342" y="314" width="54" height="16" rx="8" fill="#B8572A" fill-opacity="0.14"/>
      <rect x="262" y="356" width="180" height="78" rx="14" fill="#fff" stroke="#121115" stroke-opacity="0.08"/>
      <rect x="270" y="364" width="62" height="62" rx="10" fill="#161616" fill-opacity="0.85"/>
      <rect x="342" y="372" width="76" height="8" rx="4" fill="#121115" fill-opacity="0.8"/>
      <rect x="342" y="388" width="70" height="6" rx="3" fill="#121115" fill-opacity="0.3"/>
      <rect x="342" y="404" width="54" height="16" rx="8" fill="#B8572A" fill-opacity="0.14"/>
      <rect x="262" y="446" width="180" height="78" rx="14" fill="#fff" stroke="#121115" stroke-opacity="0.08"/>
      <rect x="270" y="454" width="62" height="62" rx="10" fill="#E3A57A"/>
      <rect x="342" y="462" width="84" height="8" rx="4" fill="#121115" fill-opacity="0.8"/>
      <rect x="342" y="478" width="58" height="6" rx="3" fill="#121115" fill-opacity="0.3"/>
      <rect x="342" y="494" width="54" height="16" rx="8" fill="#B8572A" fill-opacity="0.14"/>
    </g>

    <!-- Phone 2: enquiry -->
    <g transform="translate(-30 8)">
      <rect x="500" y="88" width="232" height="500" rx="36" fill="#161616" filter="url(#sh)"/>
      <rect x="510" y="98" width="212" height="490" rx="28" fill="#FAF8F5"/>
      <rect x="586" y="106" width="60" height="16" rx="8" fill="#161616"/>

      <path d="M532 144 l-6 6 l6 6" fill="none" stroke="#121115" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="526" y="184" font-size="16" font-weight="800" fill="#121115">Plan an event</text>
      <rect x="526" y="196" width="150" height="7" rx="3.5" fill="#121115" fill-opacity="0.3"/>

      <rect x="526" y="222" width="60" height="6" rx="3" fill="#121115" fill-opacity="0.4"/>
      <rect x="526" y="234" width="180" height="34" rx="8" fill="#fff" stroke="#121115" stroke-opacity="0.12"/>
      <rect x="538" y="248" width="90" height="7" rx="3.5" fill="#121115" fill-opacity="0.5"/>
      <rect x="526" y="282" width="76" height="6" rx="3" fill="#121115" fill-opacity="0.4"/>
      <rect x="526" y="294" width="180" height="34" rx="8" fill="#fff" stroke="#121115" stroke-opacity="0.12"/>
      <rect x="538" y="308" width="70" height="7" rx="3.5" fill="#121115" fill-opacity="0.5"/>
      <rect x="526" y="342" width="52" height="6" rx="3" fill="#121115" fill-opacity="0.4"/>
      <rect x="526" y="354" width="180" height="34" rx="8" fill="#fff" stroke="#121115" stroke-opacity="0.12"/>
      <rect x="538" y="368" width="80" height="7" rx="3.5" fill="#121115" fill-opacity="0.5"/>
      <path d="M684 368 l5 5 l5 -5" fill="none" stroke="#121115" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="526" y="404" width="180" height="44" rx="10" fill="#121115" fill-opacity="0.04"/>
      <path d="M546 414 a8 8 0 0 1 8 8 c0 6 -8 14 -8 14 s-8 -8 -8 -14 a8 8 0 0 1 8 -8 z" fill="#B8572A"/>
      <circle cx="546" cy="422" r="3" fill="#FAF8F5"/>
      <rect x="564" y="418" width="100" height="7" rx="3.5" fill="#121115" fill-opacity="0.5"/>
      <rect x="564" y="430" width="70" height="6" rx="3" fill="#121115" fill-opacity="0.25"/>

      <rect x="526" y="464" width="180" height="40" rx="20" fill="#B8572A"/>
      <text x="616" y="489" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">Send enquiry</text>
    </g>

    <!-- Callouts -->
    <g font-size="20" font-weight="700">
      <path d="M150 64 Q190 100 222 134" fill="none" stroke="#121115" stroke-width="2" stroke-dasharray="4 4"/>
      <circle cx="226" cy="138" r="7" fill="#121115" stroke="#fff" stroke-width="3"/>
      <rect x="24" y="20" width="249" height="44" rx="22" fill="#121115" filter="url(#pill)"/>
      <circle cx="46" cy="42" r="13" fill="#B8572A"/>
      <text x="46" y="48" font-size="15" text-anchor="middle" fill="#fff">1</text>
      <text x="68" y="49" fill="#fff">Split by audience</text>

      <path d="M160 294 L220 218" stroke="#121115" stroke-width="2" stroke-dasharray="4 4"/>
      <circle cx="226" cy="212" r="7" fill="#121115" stroke="#fff" stroke-width="3"/>
      <rect x="10" y="294" width="194" height="44" rx="22" fill="#121115" filter="url(#pill)"/>
      <circle cx="32" cy="316" r="13" fill="#B8572A"/>
      <text x="32" y="322" font-size="15" text-anchor="middle" fill="#fff">2</text>
      <text x="54" y="323" fill="#fff">Scan by date</text>

      <path d="M720 344 L682 320" stroke="#121115" stroke-width="2" stroke-dasharray="4 4"/>
      <circle cx="676" cy="317" r="7" fill="#121115" stroke="#fff" stroke-width="3"/>
      <rect x="690" y="344" width="260" height="44" rx="22" fill="#121115" filter="url(#pill)"/>
      <circle cx="712" cy="366" r="13" fill="#B8572A"/>
      <text x="712" y="372" font-size="15" text-anchor="middle" fill="#fff">3</text>
      <text x="734" y="373" fill="#fff">Only what’s needed</text>
    </g>
  </g>
</svg>
