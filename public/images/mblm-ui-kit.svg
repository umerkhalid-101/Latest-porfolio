<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- Abstract UI kit sheet: the shared parts every portal page was assembled from, in English and Arabic -->
  <defs>
    <g id="check"><path d="M-4.5 0 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs>
  <rect width="1600" height="1000" fill="#fff"/>

  <g font-size="17" font-weight="700" letter-spacing="2.5" fill="#B8572A">
    <text x="60" y="76">BUTTONS</text>
    <text x="580" y="76">INPUTS</text>
    <text x="1100" y="76">STEP WIZARD</text>
    <text x="60" y="536">TABLES</text>
    <text x="580" y="536">SEARCH AND FILTERS</text>
    <text x="1100" y="536">ARABIC AND ENGLISH TYPE</text>
  </g>
  <g fill="#FAF8F5" stroke="#121115" stroke-opacity="0.07">
    <rect x="60" y="96" width="440" height="380" rx="22"/>
    <rect x="580" y="96" width="440" height="380" rx="22"/>
    <rect x="1100" y="96" width="440" height="380" rx="22"/>
    <rect x="60" y="556" width="440" height="380" rx="22"/>
    <rect x="580" y="556" width="440" height="380" rx="22"/>
    <rect x="1100" y="556" width="440" height="380" rx="22"/>
  </g>

  <!-- Buttons -->
  <g font-size="19" font-weight="700" text-anchor="middle">
    <rect x="100" y="140" width="170" height="54" rx="27" fill="#fff" stroke="#121115" stroke-opacity="0.25"/>
    <text x="185" y="174" fill="#121115">Back</text>
    <rect x="290" y="140" width="170" height="54" rx="27" fill="#B8572A"/>
    <text x="375" y="174" fill="#fff">Continue</text>
    <rect x="100" y="216" width="170" height="54" rx="27" fill="#B8572A"/>
    <text x="185" y="250" fill="#fff" direction="rtl">متابعة</text>
    <rect x="290" y="216" width="170" height="54" rx="27" fill="#fff" stroke="#121115" stroke-opacity="0.25"/>
    <text x="375" y="250" fill="#121115" direction="rtl">رجوع</text>
    <rect x="100" y="292" width="360" height="54" rx="27" fill="#121115"/>
    <text x="280" y="326" fill="#fff">Submit a report</text>
  </g>
  <text x="100" y="400" font-size="16" fill="#121115" fill-opacity="0.55">Mirrored for Arabic, and sized</text>
  <text x="100" y="424" font-size="16" fill="#121115" fill-opacity="0.55">for whichever language runs longer.</text>

  <!-- Inputs -->
  <g font-size="14" font-weight="700" letter-spacing="1.5" fill="#121115" fill-opacity="0.45">
    <text x="620" y="140">DEFAULT</text>
    <text x="620" y="240">FOCUS</text>
    <text x="620" y="340">ERROR</text>
  </g>
  <rect x="620" y="152" width="360" height="54" rx="10" fill="#fff" stroke="#121115" stroke-opacity="0.18"/>
  <text x="640" y="186" font-size="18" fill="#121115" fill-opacity="0.4">Business name</text>
  <rect x="620" y="252" width="360" height="54" rx="10" fill="#fff" stroke="#B8572A" stroke-width="2.5"/>
  <rect x="616" y="248" width="368" height="62" rx="13" fill="none" stroke="#B8572A" stroke-opacity="0.2" stroke-width="4"/>
  <text x="640" y="286" font-size="18" fill="#121115">Licence application</text>
  <rect x="816" y="270" width="2" height="22" fill="#121115"/>
  <rect x="620" y="352" width="360" height="54" rx="10" fill="#FFF7F3" stroke="#C2410C" stroke-width="2"/>
  <text x="640" y="386" font-size="18" fill="#121115">31/02/2026</text>
  <circle cx="628" cy="432" r="9" fill="#C2410C"/>
  <text x="628" y="437" font-size="12" font-weight="800" text-anchor="middle" fill="#fff">!</text>
  <text x="646" y="438" font-size="16" fill="#C2410C">Enter a real date, like 28/02/2026</text>

  <!-- Step wizard -->
  <line x1="1160" y1="170" x2="1480" y2="170" stroke="#121115" stroke-opacity="0.12" stroke-width="4"/>
  <line x1="1160" y1="170" x2="1320" y2="170" stroke="#B8572A" stroke-width="4"/>
  <circle cx="1160" cy="170" r="20" fill="#B8572A"/><use href="#check" x="1160" y="171"/>
  <circle cx="1240" cy="170" r="20" fill="#B8572A"/><use href="#check" x="1240" y="171"/>
  <circle cx="1320" cy="170" r="20" fill="#fff" stroke="#B8572A" stroke-width="4"/><circle cx="1320" cy="170" r="8" fill="#B8572A"/>
  <circle cx="1400" cy="170" r="20" fill="#fff" stroke="#121115" stroke-opacity="0.2" stroke-width="2.5"/>
  <text x="1400" y="176" font-size="16" font-weight="700" text-anchor="middle" fill="#121115" fill-opacity="0.45">4</text>
  <circle cx="1480" cy="170" r="20" fill="#fff" stroke="#121115" stroke-opacity="0.2" stroke-width="2.5"/>
  <text x="1480" y="176" font-size="16" font-weight="700" text-anchor="middle" fill="#121115" fill-opacity="0.45">5</text>
  <text x="1140" y="236" font-size="15" font-weight="700" letter-spacing="1.5" fill="#B8572A">STEP 3 OF 5</text>
  <text x="1140" y="268" font-size="24" font-weight="800" fill="#121115">Business details</text>
  <rect x="1140" y="300" width="360" height="66" rx="14" fill="#fff" stroke="#121115" stroke-opacity="0.08"/>
  <circle cx="1166" cy="333" r="7" fill="#3F8F5B"/>
  <text x="1184" y="339" font-size="17" font-weight="700" fill="#121115">Progress saved</text>
  <text x="1480" y="339" font-size="16" font-weight="700" text-anchor="end" fill="#B8572A">Resume later</text>
  <rect x="1140" y="390" width="120" height="50" rx="25" fill="#fff" stroke="#121115" stroke-opacity="0.25"/>
  <text x="1200" y="421" font-size="17" font-weight="700" text-anchor="middle" fill="#121115">Back</text>
  <rect x="1340" y="390" width="160" height="50" rx="25" fill="#B8572A"/>
  <text x="1420" y="421" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">Continue →</text>

  <!-- Tables -->
  <rect x="100" y="596" width="360" height="44" rx="10" fill="#121115"/>
  <g font-size="13" font-weight="700" letter-spacing="1.5" fill="#fff">
    <text x="120" y="623">REFERENCE</text>
    <text x="270" y="623">DATE</text>
    <text x="360" y="623">STATUS</text>
  </g>
  <g font-size="16" fill="#121115">
    <line x1="100" y1="696" x2="460" y2="696" stroke="#121115" stroke-opacity="0.08"/>
    <line x1="100" y1="752" x2="460" y2="752" stroke="#121115" stroke-opacity="0.08"/>
    <line x1="100" y1="808" x2="460" y2="808" stroke="#121115" stroke-opacity="0.08"/>
    <line x1="100" y1="864" x2="460" y2="864" stroke="#121115" stroke-opacity="0.08"/>
    <text x="120" y="674" font-weight="600">APP-1042</text><text x="270" y="674" fill-opacity="0.6">12 Mar</text>
    <text x="120" y="730" font-weight="600">APP-1038</text><text x="270" y="730" fill-opacity="0.6">09 Mar</text>
    <text x="120" y="786" font-weight="600">APP-1031</text><text x="270" y="786" fill-opacity="0.6">02 Mar</text>
    <text x="120" y="842" font-weight="600">APP-1027</text><text x="270" y="842" fill-opacity="0.6">27 Feb</text>
  </g>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="356" y="656" width="96" height="26" rx="13" fill="#B8572A" fill-opacity="0.12"/><text x="404" y="674" fill="#B8572A">In review</text>
    <rect x="356" y="712" width="96" height="26" rx="13" fill="#3F8F5B" fill-opacity="0.14"/><text x="404" y="730" fill="#2F6E45">Approved</text>
    <rect x="356" y="768" width="96" height="26" rx="13" fill="#121115" fill-opacity="0.07"/><text x="404" y="786" fill="#121115" fill-opacity="0.7">Submitted</text>
    <rect x="356" y="824" width="96" height="26" rx="13" fill="#3F8F5B" fill-opacity="0.14"/><text x="404" y="842" fill="#2F6E45">Approved</text>
  </g>
  <text x="100" y="906" font-size="15" fill="#121115" fill-opacity="0.5">‹  1  2  3  ›</text>

  <!-- Search and filters -->
  <rect x="620" y="596" width="360" height="54" rx="27" fill="#fff" stroke="#121115" stroke-opacity="0.15"/>
  <circle cx="650" cy="621" r="9" fill="none" stroke="#121115" stroke-opacity="0.55" stroke-width="2.5"/>
  <path d="M657 628 l7 7" stroke="#121115" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round"/>
  <text x="676" y="629" font-size="18" fill="#121115" fill-opacity="0.4">Search guidance</text>
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="620" y="674" width="62" height="36" rx="18" fill="#121115"/><text x="651" y="697" fill="#fff">All</text>
    <rect x="692" y="674" width="104" height="36" rx="18" fill="#fff" stroke="#121115" stroke-opacity="0.2"/><text x="744" y="697" fill="#121115">Guidance</text>
    <rect x="806" y="674" width="98" height="36" rx="18" fill="#fff" stroke="#121115" stroke-opacity="0.2"/><text x="855" y="697" fill="#121115">Circulars</text>
    <rect x="914" y="674" width="66" height="36" rx="18" fill="#fff" stroke="#121115" stroke-opacity="0.2"/><text x="947" y="697" fill="#121115">2026</text>
  </g>
  <g font-size="17" fill="#121115">
    <rect x="620" y="744" width="20" height="20" rx="5" fill="#121115"/><use href="#check" x="630" y="755"/>
    <text x="656" y="760">Reporting entities</text>
    <rect x="620" y="788" width="20" height="20" rx="5" fill="#121115"/><use href="#check" x="630" y="799"/>
    <text x="656" y="804">Published this year</text>
    <rect x="620" y="832" width="20" height="20" rx="5" fill="#fff" stroke="#121115" stroke-opacity="0.3" stroke-width="2"/>
    <text x="656" y="848" fill-opacity="0.6">Arabic only</text>
  </g>
  <text x="620" y="904" font-size="15" font-weight="700" fill="#B8572A">Clear filters</text>

  <!-- Type -->
  <line x1="1140" y1="640" x2="1300" y2="640" stroke="#B8572A" stroke-opacity="0.6" stroke-width="2"/>
  <line x1="1140" y1="760" x2="1300" y2="760" stroke="#B8572A" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1220" y="740" font-size="120" font-weight="700" text-anchor="middle" fill="#121115">Aa</text>
  <line x1="1340" y1="612" x2="1500" y2="612" stroke="#B8572A" stroke-opacity="0.6" stroke-width="2"/>
  <line x1="1340" y1="800" x2="1500" y2="800" stroke="#B8572A" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1420" y="740" font-size="110" font-weight="700" text-anchor="middle" fill="#121115">أبج</text>
  <text x="1220" y="840" font-size="15" font-weight="700" letter-spacing="1.5" text-anchor="middle" fill="#121115" fill-opacity="0.5">LATIN</text>
  <text x="1420" y="840" font-size="15" font-weight="700" letter-spacing="1.5" text-anchor="middle" fill="#121115" fill-opacity="0.5">ARABIC</text>
  <text x="1140" y="896" font-size="16" fill="#121115" fill-opacity="0.55">Arabic gets more room between lines.</text>
</svg>
