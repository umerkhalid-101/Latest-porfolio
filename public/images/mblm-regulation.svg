<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- Abstract wireframe: a five-step licensing journey, annotated with the three design moves -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C8662F"/><stop offset="1" stop-color="#9E4520"/></linearGradient>
    <pattern id="cols" width="80" height="540" patternUnits="userSpaceOnUse"><rect x="8" width="64" height="540" fill="#fff" opacity="0.06"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2A0E02" flood-opacity="0.35"/></filter>
    <filter id="pill" x="-20%" y="-40%" width="140%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/></filter>
    <clipPath id="frame"><rect width="960" height="540"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="960" height="540" fill="url(#bg)"/>
    <rect width="960" height="540" fill="url(#cols)"/>

    <rect x="150" y="78" width="660" height="490" rx="18" fill="#FAF8F5" filter="url(#sh)"/>
    <g fill="#121115" opacity="0.18"><circle cx="174" cy="98" r="6"/><circle cx="194" cy="98" r="6"/><circle cx="214" cy="98" r="6"/></g>
    <rect x="390" y="88" width="180" height="20" rx="10" fill="#121115" opacity="0.06"/>
    <rect x="730" y="86" width="62" height="24" rx="12" fill="none" stroke="#121115" stroke-opacity="0.2"/>
    <text x="749" y="103" font-size="11" font-weight="700" text-anchor="middle" fill="#121115">EN</text>
    <text x="775" y="104" font-size="13" font-weight="700" text-anchor="middle" fill="#121115" fill-opacity="0.45">ع</text>
    <line x1="150" y1="118" x2="810" y2="118" stroke="#121115" stroke-opacity="0.08"/>

    <!-- Stepper -->
    <line x1="210" y1="160" x2="750" y2="160" stroke="#121115" stroke-opacity="0.12" stroke-width="3"/>
    <line x1="210" y1="160" x2="480" y2="160" stroke="#B8572A" stroke-width="3"/>
    <circle cx="210" cy="160" r="15" fill="#B8572A"/>
    <path d="M203 160 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="345" cy="160" r="15" fill="#B8572A"/>
    <path d="M338 160 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="480" cy="160" r="15" fill="#FAF8F5" stroke="#B8572A" stroke-width="3"/>
    <circle cx="480" cy="160" r="6" fill="#B8572A"/>
    <circle cx="615" cy="160" r="15" fill="#FAF8F5" stroke="#121115" stroke-opacity="0.2" stroke-width="2"/>
    <text x="615" y="165" font-size="13" font-weight="600" text-anchor="middle" fill="#121115" fill-opacity="0.45">4</text>
    <circle cx="750" cy="160" r="15" fill="#FAF8F5" stroke="#121115" stroke-opacity="0.2" stroke-width="2"/>
    <text x="750" y="165" font-size="13" font-weight="600" text-anchor="middle" fill="#121115" fill-opacity="0.45">5</text>
    <g fill="#121115">
      <rect x="178" y="188" width="64" height="7" rx="3.5" opacity="0.15"/>
      <rect x="313" y="188" width="64" height="7" rx="3.5" opacity="0.15"/>
      <rect x="448" y="188" width="64" height="7" rx="3.5" opacity="0.55"/>
      <rect x="583" y="188" width="64" height="7" rx="3.5" opacity="0.15"/>
      <rect x="718" y="188" width="64" height="7" rx="3.5" opacity="0.15"/>
    </g>

    <!-- Form -->
    <rect x="186" y="222" width="400" height="340" rx="16" fill="#fff" stroke="#121115" stroke-opacity="0.08"/>
    <text x="212" y="256" font-size="12" font-weight="700" letter-spacing="1" fill="#B8572A">STEP 3 OF 5</text>
    <rect x="212" y="270" width="240" height="14" rx="7" fill="#121115" opacity="0.85"/>
    <rect x="212" y="296" width="320" height="8" rx="4" fill="#121115" opacity="0.15"/>
    <rect x="212" y="322" width="90" height="7" rx="3.5" fill="#121115" opacity="0.3"/>
    <rect x="212" y="336" width="348" height="40" rx="8" fill="#FAF8F5" stroke="#121115" stroke-opacity="0.15"/>
    <rect x="228" y="352" width="150" height="8" rx="4" fill="#121115" opacity="0.5"/>
    <rect x="212" y="394" width="120" height="7" rx="3.5" fill="#121115" opacity="0.3"/>
    <rect x="212" y="408" width="348" height="40" rx="8" fill="#FFF7F3" stroke="#C2410C" stroke-width="1.5"/>
    <rect x="228" y="424" width="90" height="8" rx="4" fill="#121115" opacity="0.5"/>
    <circle cx="219" cy="466" r="7" fill="#C2410C"/>
    <text x="219" y="470" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">!</text>
    <text x="233" y="470" font-size="12" fill="#C2410C">Check this date and try again</text>
    <rect x="212" y="494" width="92" height="40" rx="20" fill="none" stroke="#121115" stroke-opacity="0.25"/>
    <text x="258" y="519" font-size="13" font-weight="600" text-anchor="middle" fill="#121115" fill-opacity="0.7">Back</text>
    <rect x="416" y="494" width="144" height="40" rx="20" fill="#B8572A"/>
    <text x="488" y="519" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">Continue →</text>

    <!-- Saved progress -->
    <rect x="606" y="222" width="180" height="118" rx="16" fill="#fff" stroke="#121115" stroke-opacity="0.08"/>
    <circle cx="628" cy="250" r="5" fill="#3F8F5B"/>
    <text x="642" y="254" font-size="12" font-weight="700" fill="#121115">Progress saved</text>
    <rect x="628" y="272" width="130" height="7" rx="3.5" fill="#121115" opacity="0.15"/>
    <rect x="628" y="286" width="100" height="7" rx="3.5" fill="#121115" opacity="0.15"/>
    <rect x="628" y="302" width="104" height="22" rx="11" fill="#B8572A" opacity="0.12"/>
    <text x="680" y="317" font-size="11" font-weight="700" text-anchor="middle" fill="#B8572A">Resume later</text>

    <!-- Checklist -->
    <rect x="606" y="356" width="180" height="200" rx="16" fill="#121115" fill-opacity="0.04"/>
    <g fill="#B8572A"><rect x="624" y="376" width="14" height="14" rx="4"/><rect x="624" y="408" width="14" height="14" rx="4"/></g>
    <path d="M627.5 383 l2.5 2.5 l4.5 -5 M627.5 415 l2.5 2.5 l4.5 -5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="none" stroke="#121115" stroke-opacity="0.3" stroke-width="1.5"><rect x="624" y="440" width="14" height="14" rx="4"/><rect x="624" y="472" width="14" height="14" rx="4"/><rect x="624" y="504" width="14" height="14" rx="4"/></g>
    <g fill="#121115">
      <rect x="648" y="380" width="110" height="7" rx="3.5" opacity="0.35"/>
      <rect x="648" y="412" width="92" height="7" rx="3.5" opacity="0.35"/>
      <rect x="648" y="444" width="118" height="7" rx="3.5" opacity="0.2"/>
      <rect x="648" y="476" width="84" height="7" rx="3.5" opacity="0.2"/>
      <rect x="648" y="508" width="102" height="7" rx="3.5" opacity="0.2"/>
    </g>

    <!-- Callouts -->
    <g font-size="20" font-weight="700">
      <path d="M408 64 L412 150" stroke="#121115" stroke-width="2" stroke-dasharray="4 4"/>
      <circle cx="412" cy="160" r="7" fill="#121115" stroke="#fff" stroke-width="3"/>
      <rect x="300" y="20" width="216" height="44" rx="22" fill="#121115" filter="url(#pill)"/>
      <circle cx="322" cy="42" r="13" fill="#B8572A"/>
      <text x="322" y="48" font-size="15" text-anchor="middle" fill="#fff">1</text>
      <text x="344" y="49" fill="#fff">Clear progress</text>

      <circle cx="732" cy="313" r="7" fill="#121115" stroke="#fff" stroke-width="3"/>
      <rect x="744" y="262" width="205" height="44" rx="22" fill="#121115" filter="url(#pill)"/>
      <circle cx="766" cy="284" r="13" fill="#B8572A"/>
      <text x="766" y="290" font-size="15" text-anchor="middle" fill="#fff">2</text>
      <text x="788" y="291" fill="#fff">Pick up later</text>

      <circle cx="212" cy="428" r="7" fill="#121115" stroke="#fff" stroke-width="3"/>
      <rect x="10" y="452" width="205" height="44" rx="22" fill="#121115" filter="url(#pill)"/>
      <circle cx="32" cy="474" r="13" fill="#B8572A"/>
      <text x="32" y="480" font-size="15" text-anchor="middle" fill="#fff">3</text>
      <text x="54" y="481" fill="#fff">Back on track</text>
    </g>
  </g>
</svg>
