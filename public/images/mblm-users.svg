<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 880" width="800" height="880" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- Abstract illustration: three people who arrive with a job to do -->
  <defs>
    <filter id="sh" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#121115" flood-opacity="0.14"/></filter>
    <g id="person"><circle cx="0" cy="-9" r="11"/><path d="M-19 20 a19 17 0 0 1 38 0 z"/></g>
    <g id="clock" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><circle r="9"/><path d="M0 -5 v5 l4 3"/></g>
  </defs>

  <text x="80" y="62" font-size="18" font-weight="700" letter-spacing="3" fill="#B8572A">WHO ARRIVES</text>

  <g transform="rotate(-2 400 210)">
    <rect x="80" y="100" width="640" height="220" rx="24" fill="#fff" stroke="#121115" stroke-opacity="0.08" filter="url(#sh)"/>
    <path d="M104 100 h-0 a24 24 0 0 0 -24 24 v172 a24 24 0 0 0 24 24 h8 v-220 z" fill="#B8572A"/>
    <circle cx="160" cy="172" r="38" fill="#F2C9A8"/>
    <use href="#person" x="160" y="174" fill="#B8572A"/>
    <text x="218" y="164" font-size="28" font-weight="800" fill="#121115">Founder, abroad</text>
    <text x="218" y="196" font-size="19" fill="#121115" fill-opacity="0.6">Reading local regulations for the first time</text>
    <line x1="120" y1="236" x2="690" y2="236" stroke="#121115" stroke-opacity="0.08" stroke-dasharray="6 6"/>
    <text x="120" y="282" font-size="14" font-weight="700" letter-spacing="2" fill="#121115" fill-opacity="0.45">JOB TO DO</text>
    <rect x="236" y="256" width="176" height="40" rx="20" fill="#B8572A" fill-opacity="0.12"/>
    <text x="324" y="282" font-size="18" font-weight="700" text-anchor="middle" fill="#B8572A">Get licensed</text>
    <rect x="556" y="256" width="134" height="40" rx="20" fill="#121115"/>
    <use href="#clock" x="580" y="276"/>
    <text x="598" y="282" font-size="16" font-weight="700" fill="#fff">Deadline</text>
  </g>

  <g transform="rotate(1.5 440 470)">
    <rect x="120" y="360" width="640" height="220" rx="24" fill="#fff" stroke="#121115" stroke-opacity="0.08" filter="url(#sh)"/>
    <path d="M144 360 a24 24 0 0 0 -24 24 v172 a24 24 0 0 0 24 24 h8 v-220 z" fill="#121115"/>
    <circle cx="200" cy="432" r="38" fill="#E9E4DC"/>
    <use href="#person" x="200" y="434" fill="#121115"/>
    <text x="258" y="424" font-size="28" font-weight="800" fill="#121115">Compliance officer</text>
    <text x="258" y="456" font-size="19" fill="#121115" fill-opacity="0.6">Expert, busy, finding guidance fast</text>
    <line x1="160" y1="496" x2="730" y2="496" stroke="#121115" stroke-opacity="0.08" stroke-dasharray="6 6"/>
    <text x="160" y="542" font-size="14" font-weight="700" letter-spacing="2" fill="#121115" fill-opacity="0.45">JOB TO DO</text>
    <rect x="276" y="516" width="176" height="40" rx="20" fill="#121115" fill-opacity="0.08"/>
    <text x="364" y="542" font-size="18" font-weight="700" text-anchor="middle" fill="#121115">File a report</text>
    <rect x="596" y="516" width="134" height="40" rx="20" fill="#121115"/>
    <use href="#clock" x="620" y="536"/>
    <text x="638" y="542" font-size="16" font-weight="700" fill="#fff">Deadline</text>
  </g>

  <g transform="rotate(-1 400 730)">
    <rect x="80" y="620" width="640" height="220" rx="24" fill="#fff" stroke="#121115" stroke-opacity="0.08" filter="url(#sh)"/>
    <path d="M104 620 a24 24 0 0 0 -24 24 v172 a24 24 0 0 0 24 24 h8 v-220 z" fill="#E3A57A"/>
    <circle cx="160" cy="692" r="38" fill="#FCE9DB"/>
    <use href="#person" x="160" y="694" fill="#B8572A"/>
    <text x="218" y="684" font-size="28" font-weight="800" fill="#121115">Event visitor</text>
    <text x="218" y="716" font-size="19" fill="#121115" fill-opacity="0.6">Planning a trip, often on a phone</text>
    <line x1="120" y1="756" x2="690" y2="756" stroke="#121115" stroke-opacity="0.08" stroke-dasharray="6 6"/>
    <text x="120" y="802" font-size="14" font-weight="700" letter-spacing="2" fill="#121115" fill-opacity="0.45">JOB TO DO</text>
    <rect x="236" y="776" width="176" height="40" rx="20" fill="#E3A57A" fill-opacity="0.25"/>
    <text x="324" y="802" font-size="18" font-weight="700" text-anchor="middle" fill="#9E4520">Plan a visit</text>
    <rect x="556" y="776" width="134" height="40" rx="20" fill="#121115"/>
    <use href="#clock" x="580" y="796"/>
    <text x="598" y="802" font-size="16" font-weight="700" fill="#fff">Deadline</text>
  </g>
</svg>
