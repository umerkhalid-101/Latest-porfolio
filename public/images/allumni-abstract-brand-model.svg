<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- Abstract wireframe: a brand broken into parts, each with a learned or missing status -->
  <defs>
    <g id="learned">
      <rect x="0" y="0" width="118" height="32" rx="16" fill="#DDF3EA"/>
      <circle cx="18" cy="16" r="8" fill="#1F7A55"/>
      <path d="M14 16 l3 3 l5 -6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="34" y="21" font-size="14" font-weight="700" fill="#1F7A55">Learned</text>
    </g>
    <g id="missing">
      <rect x="0" y="0" width="118" height="32" rx="16" fill="#FFE6DC"/>
      <circle cx="18" cy="16" r="7" fill="none" stroke="#C2410C" stroke-width="2"/>
      <text x="34" y="21" font-size="14" font-weight="700" fill="#C2410C">Missing</text>
    </g>
  </defs>
  <rect width="960" height="540" fill="#F6F5FB"/>
  <text x="60" y="84" font-size="30" font-weight="800" fill="#1A1530">Brand model</text>
  <rect x="60" y="100" width="260" height="10" rx="5" fill="#1A1530" opacity="0.2"/>

  <circle cx="864" cy="76" r="32" fill="none" stroke="#E4E0F5" stroke-width="8"/>
  <circle cx="864" cy="76" r="32" fill="none" stroke="#5B3DF5" stroke-width="8" stroke-linecap="round" stroke-dasharray="134 201" transform="rotate(-90 864 76)"/>
  <text x="864" y="82" font-size="16" font-weight="800" text-anchor="middle" fill="#1A1530">4/6</text>

  <g font-size="18" font-weight="600" fill="#1A1530">
    <rect x="60" y="140" width="840" height="54" rx="14" fill="#fff" stroke="#1A1530" stroke-opacity="0.08"/>
    <text x="88" y="173">Brand promise</text>
    <rect x="300" y="163" width="320" height="8" rx="4" fill="#1A1530" opacity="0.1"/>
    <use href="#learned" x="760" y="151"/>

    <rect x="60" y="204" width="840" height="54" rx="14" fill="#fff" stroke="#1A1530" stroke-opacity="0.08"/>
    <text x="88" y="237">Mission</text>
    <rect x="300" y="227" width="280" height="8" rx="4" fill="#1A1530" opacity="0.1"/>
    <use href="#learned" x="760" y="215"/>

    <rect x="60" y="268" width="840" height="54" rx="14" fill="#fff" stroke="#1A1530" stroke-opacity="0.08"/>
    <text x="88" y="301">Vision</text>
    <rect x="300" y="291" width="340" height="8" rx="4" fill="#1A1530" opacity="0.1"/>
    <use href="#learned" x="760" y="279"/>

    <rect x="60" y="332" width="840" height="54" rx="14" fill="#fff" stroke="#1A1530" stroke-opacity="0.08"/>
    <text x="88" y="365">Personality</text>
    <rect x="300" y="355" width="300" height="8" rx="4" fill="#1A1530" opacity="0.1"/>
    <use href="#learned" x="760" y="343"/>

    <rect x="60" y="396" width="840" height="54" rx="14" fill="#fff" stroke="#1A1530" stroke-opacity="0.08" stroke-dasharray="6 6"/>
    <text x="88" y="429" fill-opacity="0.6">Tone of voice</text>
    <use href="#missing" x="760" y="407"/>

    <rect x="60" y="460" width="840" height="54" rx="14" fill="#fff" stroke="#1A1530" stroke-opacity="0.08" stroke-dasharray="6 6"/>
    <text x="88" y="493" fill-opacity="0.6">Audience</text>
    <use href="#missing" x="760" y="471"/>
  </g>
</svg>
