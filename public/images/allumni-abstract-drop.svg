<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- Abstract wireframe: dragging a file over a conversation shows a drop target -->
  <rect width="1040" height="560" fill="#F6F5FB"/>
  <rect width="200" height="560" fill="#EDEAF7"/>
  <g fill="#1A1530">
    <rect x="32" y="40" width="96" height="14" rx="7" opacity="0.8"/>
    <rect x="32" y="96" width="136" height="10" rx="5" opacity="0.2"/>
    <rect x="32" y="126" width="110" height="10" rx="5" opacity="0.2"/>
    <rect x="32" y="156" width="124" height="10" rx="5" opacity="0.2"/>
  </g>
  <rect x="700" y="60" width="300" height="56" rx="24" fill="#5B3DF5" opacity="0.25"/>
  <g fill="#1A1530" opacity="0.12">
    <rect x="240" y="150" width="520" height="14" rx="7"/>
    <rect x="240" y="178" width="460" height="14" rx="7"/>
    <rect x="240" y="206" width="380" height="14" rx="7"/>
  </g>

  <rect x="232" y="40" width="776" height="480" rx="28" fill="#5B3DF5" fill-opacity="0.08" stroke="#5B3DF5" stroke-width="4" stroke-dasharray="16 12"/>
  <circle cx="620" cy="220" r="52" fill="#5B3DF5"/>
  <path d="M620 244 v-46 M600 216 l20 -20 l20 20" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="620" y="330" font-size="40" font-weight="800" text-anchor="middle" fill="#2A1B8F">Drop files to attach</text>
  <rect x="490" y="356" width="260" height="14" rx="7" fill="#2A1B8F" opacity="0.3"/>

  <g transform="rotate(10 830 420)">
    <rect x="770" y="350" width="120" height="150" rx="14" fill="#fff" stroke="#1A1530" stroke-opacity="0.15" stroke-width="2"/>
    <rect x="790" y="374" width="80" height="8" rx="4" fill="#1A1530" opacity="0.2"/>
    <rect x="790" y="392" width="64" height="8" rx="4" fill="#1A1530" opacity="0.2"/>
    <rect x="790" y="410" width="72" height="8" rx="4" fill="#1A1530" opacity="0.2"/>
    <rect x="790" y="458" width="48" height="24" rx="6" fill="#E2453C"/>
    <text x="814" y="476" font-size="14" font-weight="800" text-anchor="middle" fill="#fff">PDF</text>
  </g>
</svg>
